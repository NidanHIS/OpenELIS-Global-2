# Analyzer Setup - Docker Compose Override
#
# Purpose: Bring up the HTTP/ASTM bridge so the physical Sysmex (or any ASTM analyzer)
#          can talk to OpenELIS. No mock server — real analyzer only.
#
# Usage:
#   docker compose -f dev.docker-compose.yml -f analyzer-setup.docker-compose.yml up -d
#   docker compose -f dev.docker-compose.yml -f analyzer-setup.docker-compose.yml down
#   docker compose -f dev.docker-compose.yml -f analyzer-setup.docker-compose.yml logs -f
#
# What this does:
#   - openelis-analyzer-bridge: listens on port 12001 for ASTM from the physical analyzer,
#     forwards to OpenELIS at https://oe.openelis.org:8443/OpenELIS-Global/analyzer/astm
#   - virtual-serial: creates virtual RS232 port pairs via socat (needed if analyzer
#     connects over serial rather than TCP)

services:
  # ============================================================================
  # ASTM Mock Server — NOT needed for real analyzer testing
  # Uncomment only if you need a software Sysmex stand-in (no physical machine).
  # ============================================================================
  # astm-simulator:
  #   build:
  #     context: ./tools/analyzer-mock-server
  #     dockerfile: Dockerfile
  #   container_name: openelis-astm-simulator
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./tools/analyzer-mock-server/server.py:/app/server.py:ro
  #     - ./tools/analyzer-mock-server/fields.json:/app/fields.json:ro
  #   environment:
  #     - ASTM_PORT=5000
  #     - ANALYZER_TYPE=HEMATOLOGY
  #     - RESPONSE_DELAY_MS=100
  #   networks:
  #     default:
  #       ipv4_address: 172.20.1.100
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 5000)); s.close()"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s
  #   restart: unless-stopped
  #   labels:
  #     - "com.openelis.service=astm-simulator"
  #     - "com.openelis.purpose=testing"

  # ============================================================================
  # Virtual Serial Ports
  # Only needed if the physical analyzer connects via RS232/USB serial.
  # For TCP-connected analyzers this service is irrelevant but harmless.
  # ============================================================================
  virtual-serial:
    image: alpine/socat
    container_name: openelis-virtual-serial
    command: |
      sh -c "
      socat -d -d pty,raw,echo=0,link=/serial/ttyVUSB0 pty,raw,echo=0,link=/serial/ttyVUSB0-peer &
      socat -d -d pty,raw,echo=0,link=/serial/ttyVUSB1 pty,raw,echo=0,link=/serial/ttyVUSB1-peer &
      socat -d -d pty,raw,echo=0,link=/serial/ttyVUSB2 pty,raw,echo=0,link=/serial/ttyVUSB2-peer &
      socat -d -d pty,raw,echo=0,link=/serial/ttyVUSB3 pty,raw,echo=0,link=/serial/ttyVUSB3-peer &
      socat -d -d pty,raw,echo=0,link=/serial/ttyVUSB4 pty,raw,echo=0,link=/serial/ttyVUSB4-peer &
      wait
      "
    volumes:
      - serial-vol:/serial
    networks:
      default:
    restart: unless-stopped
    labels:
      - "com.openelis.service=virtual-serial"
      - "com.openelis.purpose=testing"

  # ============================================================================
  # OpenELIS Analyzer Bridge
  # The only required service. Listens for ASTM from the physical analyzer on
  # port 12001, translates to HTTP, forwards to OpenELIS.
  # For bidirectional Q/A (analyzer queries patient/order info), this also
  # handles the response path back to the analyzer.
  #
  # Point ORG_ITECH_AHB_FORWARD_ASTM_SERVER_HOST_NAME at the physical analyzer IP.
  # ============================================================================
  openelis-analyzer-bridge:
    image: itechuw/openelis-analyzer-bridge:latest
    container_name: openelis-analyzer-bridge
    ports:
      - "8442:8443"   # HTTPS API port (bridge management)
      - "12000:12001" # ASTM LIS1-A (ENQ/ACK) — matches real Sysmex XN-350 protocol
    volumes:
      - ./volume/openelis-analyzer-bridge/configuration.yml:/app/configuration.yml:ro
      - key_trust-store-volume:/etc/openelis-global
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOGGING_LEVEL_ORG_ITECH=DEBUG
      # Where OpenELIS receives ASTM messages
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_URI=https://oe.openelis.org:8443/OpenELIS-Global/analyzer
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_USERNAME=admin
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_PASSWORD=adminADMIN!
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_INSECURE_TLS=true
      - JDK_JAVA_OPTIONS=-Djdk.internal.httpclient.disableHostnameVerification=true
      # Port this bridge listens on for incoming ASTM from the analyzer
      - ORG_ITECH_AHB_LISTEN_ASTM_SERVER_PORT=12001
      # Physical analyzer IP and port — update this to match the real machine
      - ORG_ITECH_AHB_FORWARD_ASTM_SERVER_HOST_NAME=172.20.1.100
      - ORG_ITECH_AHB_FORWARD_ASTM_SERVER_PORT=5000
    networks:
      default:
        ipv4_address: 172.22.1.101
    # depends_on removed — no mock to wait for, bridge starts immediately
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      - "com.openelis.service=openelis-analyzer-bridge"
      - "com.openelis.purpose=production"

  # ============================================================================
  # OpenELIS Override - Mount virtual serial ports into the webapp container
  # ============================================================================
  oe.openelis.org:
    volumes:
      - serial-vol:/dev/serial

# Network - must match dev.docker-compose.yml
networks:
  default:
    name: openelis-global-2_default

volumes:
  serial-vol:
    driver: local
  key_trust-store-volume:





